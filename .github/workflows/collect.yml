
name: Collect Oregon Tow IDs (manual)

on:
  workflow_dispatch:
    inputs:
      start_id:
        description: First AutoReturn vehicle ID
        type: string
        default: '9994704'
        required: true
      end_id:
        description: Last AutoReturn vehicle ID
        type: string
        default: '9994704'
        required: true
      confirm_authorized:
        description: I confirm automated retrieval is authorized
        type: boolean
        required: true
        default: false

concurrency:
  group: tow-tracker-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_authorized == true }}
    timeout-minutes: 20

    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check parser tests
        run: python -m unittest discover -s tests -q

      - name: Collect sequential vehicle IDs
        env:
          START_ID: ${{ inputs.start_id }}
          END_ID: ${{ inputs.end_id }}
        run: |
          python -m towtracker.collector --start "$START_ID" --end "$END_ID" --delay 5 --authorized

      - name: Save Oregon archive changes
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [[ -n "$(git status --porcelain -- archive site/data/records.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive/records.json archive/review.json archive/state.json site/data/records.json
            git commit -m "Archive Oregon tow records"
            git push
          else
            echo "No archive changes to commit."
          fi
